<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- PWA / Identidade -->
    <meta name="theme-color" content="#1A0F0D" />
    <meta name="application-name" content="Flyguer BarberShop" />
    <meta name="description" content="Flyguer BarberShop — Agendamentos em tempo real. Nossa Arte, Seu Estilo. Shopping Cidade das Artes, Piso 2, Nº 22." />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Flyguer" />
    <link rel="apple-touch-icon" href="/logo192.png" />

    <link rel="apple-touch-icon" sizes="512x512" href="/logo512.png" />

    <!-- Android / Chrome PWA -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo512.png" />

    <meta property="og:title" content="Flyguer BarberShop" />
    <meta property="og:description" content="Agende seu corte em tempo real. Nossa Arte, Seu Estilo." />
    <meta property="og:image" content="/logo512.png" />

    <!-- Splash screen iOS -->
    <style>
      body { margin: 0; background-color: #1A0F0D; }

    <title>Flyguer BarberShop</title>
